# Postgres for notebooks 5, 6, 9 and 10.
#   docker compose up -d
# Published on 55432 (not 5432) so it never clashes with another local Postgres.
# Override with PGPORT for both compose and the notebooks.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:${PGPORT:-55432}:5432"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
