[project]
name = "python-concurrency-workshop"
version = "0.1.0"
description = "Hands-on workshop for Python concurrency: threads, processes and asyncio."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "asyncpg>=0.30",
    "beautifulsoup4>=4.12",
    "django>=5.1",
    "fastapi>=0.115",
    "flask>=3.0",
    "gunicorn>=23.0",
    "numpy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "requests>=2.32",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "uvloop>=0.21; sys_platform != 'win32'",
]

[dependency-groups]
load = ["locust>=2.31"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B007", "B018"]  # teaching code: unused loop vars and bare expressions are intentional
