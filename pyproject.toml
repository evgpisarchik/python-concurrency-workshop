[project]
name = "python-concurrency-workshop"
version = "0.1.0"
description = "Hands-on marimo workshop for Python concurrency: threads, processes and asyncio."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "asgiref>=3.8",
    "asyncpg>=0.30",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "marimo>=0.25.0",
    "numpy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "requests>=2.32",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "uvloop>=0.21; sys_platform != 'win32'",
]

[dependency-groups]
load = ["locust>=2.31"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workshop"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B007", "B018"]  # teaching code: unused loop vars and bare expressions are intentional

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E501"]  # long markdown lines in mo.md() cells
